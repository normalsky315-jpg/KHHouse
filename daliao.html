<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>大寮區建案儀表板 | KHHouse</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#1E293B;          /* 深藍灰，取代深墨綠 */
  --ink2:#0F172A;
  --primary:#2563EB;      /* 現代藍，取代金色 */
  --primary-soft:#DBEAFE;
  --bg:#F8FAFC;
  --paper:#FFFFFF;
  --paper2:#F8FAFC;
  --line:#E5E7EB;
  --text:#1F2937;
  --dim:#6B7280;
  --mute:#9CA3AF;
  --red:#DC2626;   --red-bg:#FEF2F2;
  --green:#16A34A; --green-bg:#F0FDF4;
  --amber:#D97706; --amber-bg:#FFFBEB;
  --serif:'Noto Sans TC',sans-serif;
  --sans:'Noto Sans TC',sans-serif;
  --mono:'Noto Sans TC',sans-serif;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --shadow-hover:0 12px 28px rgba(15,23,42,.10);
}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased}

/* ───── 頁首 ───── */
.masthead{background:linear-gradient(120deg,#1E3A8A 0%,#2563EB 55%,#3B82F6 100%);position:relative;overflow:hidden}
.masthead::after{content:'';position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.08)}
.mast-in{max-width:1400px;margin:0 auto;padding:28px 32px 24px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between;position:relative}
.mast-title{display:flex;gap:14px;align-items:flex-end}
.mast-mark{width:6px;height:34px;border-radius:4px;background:#FBBF24;align-self:center}
.mast-title h1{font-family:var(--serif);font-weight:800;font-size:26px;letter-spacing:-.01em;line-height:1.25;color:#fff}
.mast-title .sub{font-size:13px;color:rgba(255,255,255,.75);margin-top:5px}
.mast-stats{display:flex;gap:10px;flex-wrap:wrap}
.mstat{padding:10px 20px;border-radius:var(--radius-sm);background:rgba(255,255,255,.12);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.18)}
.mstat .l{font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.7);margin-bottom:3px}
.mstat .v{font-family:var(--serif);font-weight:800;font-size:24px;line-height:1.1;color:#fff}
.mstat .v small{font-size:12px;color:rgba(255,255,255,.75);font-weight:400;margin-left:2px}
.mstat .v.hi{color:#FCA5A5}
.mstat .v.lo{color:#86EFAC}
.mstat .s{font-size:10.5px;color:rgba(255,255,255,.6);margin-top:2px}

/* ───── 指標列 ───── */
.kpis{background:var(--paper2);border-bottom:1px solid var(--line)}
.kpis-in{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line)}
.kpi{padding:14px 22px;background:var(--paper2);position:relative}
.kpi .l{font-size:11px;color:var(--mute);letter-spacing:.04em;margin:2px 0 3px}
.kpi .v{font-family:var(--serif);font-size:22px;font-weight:700}
.kpi .v.red{color:var(--red)} .kpi .v.green{color:var(--green)}
.kpi .s{font-size:12px;color:var(--dim)}

/* ───── 工具列 ───── */
.toolbar{max-width:1400px;margin:0 auto;padding:16px 32px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.vbtn{padding:9px 20px;font-family:var(--sans);font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--paper);color:var(--dim);transition:.13s}
.vbtn.active,.vbtn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.search-inp{flex:1;min-width:220px;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font:14.5px var(--sans);outline:none}
.search-inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
select.fil{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font:14px var(--sans);cursor:pointer;outline:none;color:var(--text)}
select.fil:focus{border-color:var(--primary)}
.tbl-ct{font-size:13px;color:var(--mute)}

.main{max-width:1400px;margin:0 auto;padding:18px 32px 70px}

/* ───── 地圖 ───── */
#mapView{display:none;margin-bottom:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);overflow:hidden;box-shadow:var(--shadow)}
.map-head{padding:12px 20px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.map-head h2{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--ink)}
.map-head .mleg{font-size:12px;color:var(--mute)}
#theMap{height:560px}
.leaflet-container{background:#EEF1F5!important;font-family:var(--sans)!important}
.leaflet-popup-content-wrapper{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0;box-shadow:0 12px 32px rgba(15,23,42,.16)}
.leaflet-popup-content{margin:0;padding:0;width:236px!important}
.leaflet-popup-tip{background:var(--paper)}
.mpopup{padding:14px 16px}
.mpopup-tag{font-size:11px;letter-spacing:.04em;font-weight:600;margin-bottom:5px}
.mpopup h3{font-family:var(--serif);font-size:17px;font-weight:700;margin-bottom:4px;color:var(--ink)}
.mpopup .mprice{font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:2px}
.mpopup .mdelta{font-size:12px;margin-bottom:8px}
.mpopup .mrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);padding:3px 0;border-bottom:1px solid var(--line)}
.mpopup .mrow span:last-child{color:var(--text);font-weight:500}
.mpopup .dbtn{display:block;width:100%;text-align:center;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px}
.mpopup .dbtn:hover{background:var(--primary)}
.mpill{display:inline-flex;flex-direction:column;align-items:center;padding:5px 11px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 14px rgba(15,23,42,.22);transition:transform .12s;border-radius:999px;min-width:74px}
.mpill:hover{transform:scale(1.08);z-index:9999}
.mpill .pn{font-size:12px;font-weight:700;line-height:1.3;font-family:var(--sans)}
.mpill .pp{font-size:11px;opacity:.9;line-height:1.3}
.mpill.normal{background:var(--primary);color:#fff}
.mpill.new{background:var(--green);color:#fff}
.mpill.presale{background:#fff;color:var(--ink);border:1.5px dashed var(--primary)}
.mpill.warn{background:var(--amber);color:#fff}

/* ───── 卡片 ───── */
#listView{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.case-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .16s,transform .16s;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.case-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px)}
.case-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.case-card.pre::before{background:var(--amber)}
.case-card.new::before{background:var(--green)}
.case-card.done::before{background:var(--primary)}
.case-card.warn::before{background:repeating-linear-gradient(90deg,var(--amber) 0 14px,transparent 14px 22px)}
.cc-head{padding:18px 20px 12px;background:linear-gradient(180deg,var(--paper2),var(--paper));border-bottom:1px solid var(--line)}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cc-name{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.3;color:var(--ink)}
.cc-devtop{font-size:12.5px;color:var(--mute);margin-bottom:4px}
.cc-price{font-family:var(--serif);font-size:23px;font-weight:800;white-space:nowrap;line-height:1.1}
.cc-price small{font-size:12px;color:var(--dim);font-weight:400;font-family:var(--sans)}
.cc-price.red{color:var(--red)} .cc-price.green{color:var(--green)} .cc-price.amber{color:var(--amber)}
.cc-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}
.cc-dev{font-size:13px;color:var(--dim)}
.status-pill{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
.sp-pre{background:var(--amber-bg);color:var(--amber)}
.sp-new{background:var(--green-bg);color:var(--green)}
.sp-done{background:var(--primary-soft);color:var(--primary)}
.cc-vs{margin:0 20px;padding:8px 0 2px;font-size:13px;color:var(--ink);line-height:1.55}
.cc-vs::before{content:'對戰觀點';font-size:10px;letter-spacing:.1em;color:var(--primary);display:block;margin-bottom:2px;font-weight:600}
.cc-sold{padding:12px 20px;border-bottom:1px solid var(--line)}
.sold-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sold-l{font-size:12px;color:var(--dim)}
.sold-pct{font-family:var(--serif);font-size:16px;font-weight:700}
.sold-bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.sold-fill{height:100%;border-radius:999px}
.sold-fill.green{background:var(--green)} .sold-fill.amber{background:var(--amber)} .sold-fill.blue{background:var(--primary)}
.sold-sub{font-size:11px;color:var(--mute);margin-top:4px}
.cc-chips{padding:12px 20px;display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{display:inline-block;font-size:12px;padding:4px 11px;border-radius:999px;color:var(--dim);background:var(--paper2);border:1px solid var(--line)}
.chip.k{color:var(--amber);background:var(--amber-bg);border-color:transparent}
.chip.b{color:var(--primary);background:var(--primary-soft);border-color:transparent}
.chip.am{color:var(--green);background:var(--green-bg);border-color:transparent}
.chip.am-more{color:var(--mute)}
.cc-amenities{padding:8px 20px 13px;display:flex;flex-wrap:wrap;gap:6px}
.cc-foot{padding:13px 20px;background:var(--paper2);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.vs-track{flex:1;height:4px;background:var(--line);border-radius:999px;position:relative}
.vs-center{position:absolute;left:50%;top:-4px;width:1.5px;height:12px;background:var(--mute)}
.vs-fill{height:100%;border-radius:999px}
.vs-pos{background:var(--red);margin-left:50%}
.vs-neg{background:var(--green);float:right;margin-right:50%}
.vs-pct{font-size:13.5px;font-weight:700;min-width:60px;text-align:right}
.vs-pct.up{color:var(--red)} .vs-pct.dn{color:var(--green)}
.tag-badge{font-size:12.5px;font-weight:700;padding:5px 13px;border-radius:999px}
.tb-red{color:var(--red);background:var(--red-bg)}
.tb-green{color:var(--green);background:var(--green-bg)}
.tb-amber{color:var(--amber);background:var(--amber-bg)}
.tb-blue{color:var(--primary);background:var(--primary-soft)}

/* ───── 平面圖/燈箱 ───── */
.fp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.fp-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;cursor:pointer;border:1px solid var(--line);border-radius:10px;transition:opacity .12s}
.fp-thumb:hover{opacity:.85}
.fp-count{font-size:12px;color:var(--dim)}
.lb-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:99999;align-items:center;justify-content:center;flex-direction:column}
.lb-overlay.on{display:flex}
.lb-img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lb-close{position:fixed;top:16px;right:20px;color:#fff;font-size:32px;cursor:pointer;background:none;border:none;line-height:1;opacity:.8}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);color:#fff;font-size:32px;cursor:pointer;background:rgba(255,255,255,.15);border:none;border-radius:999px;padding:12px 16px;opacity:.85}
.lb-nav:hover,.lb-close:hover{opacity:1}
.lb-prev{left:8px}.lb-next{right:8px}
.lb-counter{position:fixed;bottom:16px;color:rgba(255,255,255,.7);font-size:13px}

/* ───── 詳情視窗 ───── */
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);z-index:9000;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--paper);border-radius:20px;width:100%;max-width:840px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}
.modal-hd{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);color:var(--ink);padding:20px 26px;display:flex;justify-content:space-between;align-items:flex-start;z-index:2}
.modal-hd h2{font-family:var(--serif);font-size:22px;font-weight:800;margin-top:6px;color:var(--ink)}
.modal-hd .mdev{font-size:13px;color:var(--mute);margin-top:3px}
.modal-hd button{background:var(--bg);border:1px solid var(--line);border-radius:999px;color:var(--dim);width:34px;height:34px;font-size:18px;cursor:pointer;flex-shrink:0}
.modal-hd button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.modal-bd{padding:24px 26px}
.modal-sold{padding:16px 26px;background:var(--paper2);border-bottom:1px solid var(--line)}
.ms-row{display:flex;align-items:center;gap:14px}
.ms-bar{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.ms-fill{height:100%;border-radius:999px}
.ms-pct{font-family:var(--serif);font-size:17px;font-weight:700;min-width:52px;text-align:right}
.ms-detail{font-size:13px;color:var(--dim);margin-top:4px}
.price-hero{display:flex;align-items:baseline;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:4px;flex-wrap:wrap}
.ph-num{font-family:var(--serif);font-size:44px;font-weight:800;line-height:1}
.ph-unit{font-size:14px;color:var(--dim)}
.msec-title{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--ink);margin:22px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.msec-title::before{content:'';width:14px;height:3px;border-radius:2px;background:var(--primary)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-cell{background:var(--paper2);border-radius:var(--radius-sm);padding:13px 16px}
.info-cell.full{grid-column:1/-1}
.ic-label{font-size:11px;color:var(--mute);margin-bottom:4px}
.ic-val{font-size:15px;font-weight:500}
.mat-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.notes-box{background:var(--amber-bg);border-radius:var(--radius-sm);padding:13px 17px;font-size:14px;color:var(--dim);line-height:1.7;margin-top:14px}
.analysis-box{background:var(--paper2);border-radius:var(--radius-sm);padding:13px 17px;font-size:15px;line-height:1.7;margin-top:12px}
.analysis-box .al{font-family:var(--serif);font-size:12px;color:var(--primary);font-weight:700;margin-bottom:6px;display:block}
.vs-box{background:var(--ink);color:#fff;border-radius:var(--radius-sm);padding:14px 17px;font-size:15px;line-height:1.7;margin-top:12px}
.vs-box .al{font-family:var(--serif);font-size:12px;color:#93C5FD;font-weight:700;margin-bottom:6px;display:block}
.am-group{margin-bottom:10px}
.am-group-label{font-size:11px;color:var(--ink);font-weight:600;margin-bottom:6px}
.am-chips{display:flex;flex-wrap:wrap;gap:6px}
.link-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.link-btn{font-size:13.5px;font-weight:600;padding:10px 20px;border-radius:999px;text-decoration:none;border:1px solid var(--line);color:var(--ink);transition:.12s}
.link-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
#loadErr{max-width:700px;margin:60px auto;background:var(--paper);border:1px solid var(--red);border-radius:var(--radius);padding:24px;display:none;font-size:15px;line-height:1.8}
.footer{max-width:1400px;margin:0 auto;padding:0 32px 40px;font-size:12px;color:var(--mute)}
.back-link{display:inline-block;margin-left:8px;font-size:12px;color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 14px}
.back-link:hover{background:var(--paper2);color:var(--ink)}

@media(max-width:980px){
  .kpis-in{grid-template-columns:repeat(2,1fr)}
  #listView{grid-template-columns:1fr}
  .info-grid{grid-template-columns:1fr}
  .mast-in{padding:20px 18px}
  .mast-title h1{font-size:21px}
  .mstat{padding:8px 14px}
  .mstat .v{font-size:20px}
  .toolbar,.main,.footer{padding-left:18px;padding-right:18px}
}
</style>
</head>
<body>

<div class="masthead">
  <div class="mast-in">
    <div class="mast-title">
      <div class="mast-mark"></div>
      <div>
        <h1 id="hTitle">大寮區建案儀表板</h1>
        <div class="sub" id="hSub">—</div>
      </div>
    </div>
    <div class="mast-stats" id="mastStats"></div>
  </div>
</div>

<div style="max-width:1560px;margin:0 auto">
  <div class="toolbar">
    <button class="vbtn active" id="btnList" onclick="setView('list')">卡 片</button>
    <button class="vbtn" id="btnMap" onclick="setView('map')">地 圖</button>
    <input class="search-inp" id="searchInput" placeholder="搜尋案名、建商、建材…">
    <select class="fil" id="statusFilter">
      <option value="all">全部狀態</option><option value="預售">預售屋</option>
      <option value="新成屋">新成屋</option><option value="成屋">成屋</option>
    </select>
    <select class="fil" id="sortSelect">
      <option value="price_desc">單價 ↓</option><option value="price_asc">單價 ↑</option>
      <option value="sold_desc">售出率 ↓</option><option value="count_desc">成交量 ↓</option>
    </select>
    <span class="tbl-ct" id="tblCt"></span>
  </div>
</div>

<div class="main">
  <div id="mapView">
    <div class="map-head">
      <h2>地圖分布 · 案名＋均價</h2>
      <span class="mleg">■ 紅＝溢價　■ 墨綠＝均值　■ 綠＝折價　⬚ 虛框＝預售　■ 土金＝警示</span>
    </div>
    <div id="theMap"></div>
  </div>
  <div id="listView"></div>
  <div id="loadErr"></div>
</div>

<div class="footer" id="footer"></div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-hd">
      <div>
        <div id="modalTag"></div>
        <h2 id="modalTitle"></h2>
        <div class="mdev" id="modalDev"></div>
      </div>
      <button onclick="closeModal()">×</button>
    </div>
    <div id="modalSold" class="modal-sold"></div>
    <div class="modal-bd" id="modalBody"></div>
  </div>
</div>

<div class="lb-overlay" id="lbOverlay">
  <button class="lb-close" onclick="closeLB()">×</button>
  <button class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
  <img class="lb-img" id="lbImg" alt="平面圖">
  <button class="lb-nav lb-next" onclick="lbNav(1)">›</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
/* 大寮專屬頁：共用 KHHouse 同一份 data.json，僅在載入後過濾為 district==='大寮'。
   之後在 data.json 增修大寮建案，這頁會自動同步，不需要另外維護資料。 */
const PAGE_DISTRICT='大寮';
let DB=null, projects=[], S=null, curDist=PAGE_DISTRICT;
const scoped=()=>projects;
const distBase=()=>(S.districtBase&&S.districtBase[curDist])||S.base;

const baseOf=p=>(S.districtBase&&S.districtBase[p.district])||S.base;
const hasPrice=p=>typeof p.avgPrice==='number'&&p.avgPrice>0;
function tagOf(p){
  if(p.tagMode==='manual') return p.tagManual||'normal';
  if(!hasPrice(p)) return 'normal';
  const pct=(p.avgPrice-baseOf(p))/baseOf(p)*100;
  return pct>=S.premiumPct?'premium':pct<=S.discountPct?'discount':'normal';
}
const pctOf=p=>hasPrice(p)?(p.avgPrice-baseOf(p))/baseOf(p)*100:null;
function getSold(p){
  if(!p.units||p.count==null) return null;
  return {pct:Math.min(Math.round(p.count/p.units*100),100), text:`實登 ${p.count} / ${p.units} 戶`};
}
const soldColor=pct=>pct>=50?'green':pct>=20?'amber':'blue';
const statusCls=s=>s.includes('預售')?'sp-pre':s.includes('新成')?'sp-new':'sp-done';
const statusAccent=s=>s.includes('預售')?'pre':s.includes('新成')?'new':'done';
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ── 頁首與 KPI：全部由資料即時計算 ── */
function renderHeader(){
  document.getElementById('hTitle').textContent='大寮區建案儀表板';
  document.getElementById('hSub').textContent=`${S.subtitle} · ${S.version} · 資料 ${S.dataDate}`;
  document.title='大寮區建案儀表板 | KHHouse';
  const sp=scoped();
  document.getElementById('mastStats').innerHTML=`
    <div class="mstat"><div class="l">行政區</div><div class="v" style="font-size:24px">大寮</div><div class="s">DISTRICT</div></div>
    <div class="mstat"><div class="l">案數</div><div class="v">${sp.length}</div><div class="s">CASES</div></div>`;
  document.getElementById('footer').innerHTML=`大寮區建案儀表板 · ${S.subtitle} · ${S.version} <a class="back-link" href="./index.html" style="color:var(--dim);border-color:var(--line)">← 回全區總覽</a>`;
}

/* ── 卡片 ── */
function renderCards(){
  const search=document.getElementById('searchInput').value.toLowerCase();
  const stat=document.getElementById('statusFilter').value;
  const sort=document.getElementById('sortSelect').value;
  let data=projects.map((p,i)=>({...p,idx:i,sold:getSold(p)}));
  if(search) data=data.filter(p=>[p.name,p.dev,p.addr,p.district,p.zone,...(p.kit||[]),...(p.bath||[]),...(p.other||[])].join(' ').toLowerCase().includes(search));
  if(stat!=='all') data=data.filter(p=>p.status.includes(stat));
  if(sort==='price_desc') data.sort((a,b)=>(b.avgPrice??-1)-(a.avgPrice??-1));
  else if(sort==='price_asc') data.sort((a,b)=>(a.avgPrice??1e9)-(b.avgPrice??1e9));
  else if(sort==='sold_desc') data.sort((a,b)=>(b.sold?.pct||0)-(a.sold?.pct||0));
  else data.sort((a,b)=>(b.count||0)-(a.count||0));
  document.getElementById('tblCt').textContent=`${data.length} / ${scoped().length} 案`;

  document.getElementById('listView').innerHTML=data.map(p=>{
    const hasP=hasPrice(p);
    const accent=statusAccent(p.status);
    const kits=(p.kit||[]).slice(0,2).map(k=>`<span class="chip k">${esc(k.substring(0,20))}</span>`).join('');
    const baths=(p.bath||[]).slice(0,1).map(b=>`<span class="chip b">${esc(b.substring(0,18))}</span>`).join('');
    const allAm=p.amenities?Object.values(p.amenities).flat():[];
    const amRow=allAm.length?`<div class="cc-amenities">${allAm.slice(0,4).map(a=>`<span class="chip am">${esc(a)}</span>`).join('')}${allAm.length>4?`<span class="chip am-more">+${allAm.length-4}</span>`:''}</div>`:'';
    const vsRow=(p.vs&&p.vsPublic)?`<div class="cc-vs">${esc(p.vs)}</div>`:'';
    const sc=p.sold?soldColor(p.sold.pct):'blue';
    const soldBar=p.sold?`<div class="cc-sold">
      <div class="sold-label"><span class="sold-l">銷售進度（實登/總戶）</span>
      <span class="sold-pct" style="color:var(--${sc==='blue'?'primary':sc})">${p.sold.pct}%</span></div>
      <div class="sold-bar"><div class="sold-fill ${sc}" style="width:${p.sold.pct}%"></div></div>
      <div class="sold-sub">${p.sold.text}</div></div>`:'';
    const dealLines=[];
    if(p.minPrice!=null&&p.maxPrice!=null) dealLines.push(`單價 ${p.minPrice}~${p.maxPrice} 萬/坪`);
    if(p.totalMin!=null&&p.totalMax!=null) dealLines.push(`總價約 ${p.totalMin}~${p.totalMax} 萬`);
    if(p.count!=null) dealLines.push(`${p.count} 筆成交`);
    const dealInfo=dealLines.length?`<div style="font-size:12px;color:var(--mute);margin-top:3px;line-height:1.6">實登：${dealLines.join(' · ')}</div>`:'';
    return `<div class="case-card ${accent}${p.warn?' warn':''}" onclick="openModal(${p.idx})">
      <div class="cc-head">${p.dev?`<div class="cc-devtop">${esc(p.dev)}</div>`:''}<div class="cc-top">
        <div class="cc-name">${esc(p.name)}${p.warn?' ⚠':''}</div>
        <div class="cc-price"${hasP?'':' style="font-size:17px;color:var(--amber)"'}>${hasP?p.avgPrice.toFixed(2)+'<small> 萬</small>':(p.askPrice?esc(p.askPrice)+'<small> 開價</small>':'待定')}</div></div>
        ${dealInfo}
        <div class="cc-meta">${p.district?`<span class="status-pill sp-done">${esc(p.district)}</span>`:''}${p.zone?`<span class="status-pill sp-pre">${esc(p.zone)}</span>`:''}
        <span class="status-pill ${statusCls(p.status)}">${esc(p.status)}</span></div></div>
      ${vsRow}${soldBar}
      <div class="cc-chips">${kits}${baths}</div>${amRow}
      ${!p.sold?`<div class="cc-foot">
        <span style="font-size:12.5px;color:var(--mute)">${hasP?'尚無銷售進度資料':'尚無實價登錄'}</span></div>`:''}</div>`;
  }).join('');
}

/* ── 地圖 ── */
let mapObj=null,mapMarkers=[];
function initMap(){
  if(mapObj){buildMarkers();return}
  mapObj=L.map('theMap',{zoomControl:true,scrollWheelZoom:true}).setView([22.6870,120.3010],13);
  L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{
    attribution:'&copy; Google',subdomains:['0','1','2','3'],maxZoom:20
  }).addTo(mapObj);
  buildMarkers();
}
function buildMarkers(){
  mapMarkers.forEach(m=>mapObj.removeLayer(m));
  mapMarkers=[];
  projects.forEach((p,i)=>{
    if(p.lat==null||p.lng==null) return;
    let cls=p.status.includes('預售')?'presale':(p.status.includes('新成')?'new':'normal');
    if(p.warn) cls='warn';
    const ic=L.divIcon({className:'',html:`<div class="mpill ${cls}"><span class="pn">${esc(p.name)}</span><span class="pp">${hasPrice(p)?p.avgPrice.toFixed(2)+' 萬':'待定'}</span></div>`,iconSize:[null,null],iconAnchor:[0,30]});
    const m=L.marker([p.lat,p.lng],{icon:ic}).addTo(mapObj);
    const pc='var(--primary)';
    const sold=getSold(p);
    m.bindPopup(`<div class="mpopup">
      <div class="mpopup-tag" style="color:${pc}">● ${esc(p.status)}</div>
      <h3>${esc(p.name)}</h3>
      <div class="mprice" style="color:${pc}">${hasPrice(p)?p.avgPrice.toFixed(2)+' 萬/坪':(p.askPrice?'開價 '+esc(p.askPrice):'價格待定')}</div>
      <div class="mrow"><span>建商</span><span>${esc(p.dev)}</span></div>
      <div class="mrow"><span>戶數</span><span>${p.units} 戶</span></div>
      ${sold?`<div class="mrow"><span>銷售進度</span><span style="color:${pc}">${sold.pct}%</span></div>`:''}
      <button class="dbtn" onclick="closePopups();openModal(${i})">查看完整詳情 →</button></div>`,{maxWidth:236});
    mapMarkers.push(m);
  });
  if(mapMarkers.length) mapObj.fitBounds(L.featureGroup(mapMarkers).getBounds().pad(0.15));
}
function closePopups(){if(mapObj)mapMarkers.forEach(m=>m.closePopup())}
function setView(v){
  document.getElementById('listView').style.display=v==='list'?'':'none';
  document.getElementById('mapView').style.display=v==='map'?'block':'none';
  document.getElementById('btnList').classList.toggle('active',v==='list');
  document.getElementById('btnMap').classList.toggle('active',v==='map');
  if(v==='map'){initMap();setTimeout(()=>mapObj.invalidateSize(),80)}
}

/* ── 詳情 ── */
function openModal(i){
  const p=projects[i];
  const pc='var(--primary)';
  document.getElementById('modalTag').innerHTML=`<span class="tag-badge ${statusCls(p.status)==='sp-pre'?'tb-amber':statusCls(p.status)==='sp-new'?'tb-green':'tb-blue'}" style="font-size:13px">${esc(p.status)}</span>`;
  document.getElementById('modalTitle').textContent=p.name+(p.warn?' ⚠':'');
  document.getElementById('modalDev').textContent=`${p.district?p.district+' · ':''}${p.dev} · ${p.status} · 交屋：${p.handover||'—'}`;
  const sold=getSold(p);
  document.getElementById('modalSold').innerHTML=sold?`<div class="ms-row">
    <span style="font-size:14px;color:var(--dim);min-width:100px">售出率（實登）</span>
    <div class="ms-bar"><div class="ms-fill" style="width:${sold.pct}%;background:${pc}"></div></div>
    <span class="ms-pct" style="color:${pc}">${sold.pct}%</span></div>
    <div class="ms-detail">${sold.text} · 貸款成數 ${esc(p.loan||'—')}</div>`:'';
  const donut=(()=>{const vals=[['2R',p.r2||0,'#33658A'],['3R',p.r3||0,'#2F6B4F'],['4R',p.r4||0,'#C19A53'],['1R',p.r1||0,'#8E7CC3']].filter(x=>x[1]>0);
    const size=52,cx=26,cy=26,R=17.7,sw=5.7,circ=2*Math.PI*R;let off=0,arcs='';
    vals.forEach(([_,v,c])=>{const dash=circ*v/100;arcs+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-circ*off/100}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=v});
    const main=(p.r3||0)>(p.r2||0)?`${p.r3}%`:`${p.r2||0}%`;
    return `<svg width="52" height="52" viewBox="0 0 52 52">${arcs}<text x="26" y="30" text-anchor="middle" style="font-family:var(--mono);font-size:11px;font-weight:600">${main}</text></svg>`})();
  const fpHtml=(p.floorPlans&&p.floorPlans.length)?`
    <div class="msec-title">平 面 圖</div>
    <div class="fp-count">共 ${p.floorPlans.length} 張 · 點擊放大</div>
    <div class="fp-grid">${p.floorPlans.map((u,fi)=>`<img class="fp-thumb" src="${esc(u)}" loading="lazy" onclick="openLB(${i},${fi})" onerror="this.style.display='none'">`).join('')}</div>`:'';
  document.getElementById('modalBody').innerHTML=`
    <div class="price-hero">
      ${hasPrice(p)?`<span class="ph-num" style="color:${pc}">${p.avgPrice.toFixed(2)}</span>
      <span class="ph-unit">萬/坪（單價）</span>
      <span style="font-size:14px;color:var(--dim)">單價 ${p.minPrice} ~ ${p.maxPrice} 萬/坪</span>`
      :`<span class="ph-num" style="color:var(--amber);font-size:34px">${p.askPrice?esc(p.askPrice):'價格待定'}</span>
      <span class="ph-unit">${p.askPrice?'開價（實價登錄待累積）':''}</span>`}</div>
    ${(p.totalMin!=null&&p.totalMax!=null)?`<div style="display:flex;align-items:baseline;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:4px">
      <span style="font-family:var(--serif);font-size:22px;font-weight:700;color:var(--ink)">${p.totalMin} ~ ${p.totalMax}</span>
      <span style="font-size:13px;color:var(--dim)">萬（總價，依實際格局坪數換算）</span></div>`:''}
    ${hasPrice(p)?`<div class="notes-box" style="margin-top:0">📊 依內政部不動產交易實價查詢服務網，近兩年真實成交紀錄共 <b>${p.count??'—'}</b> 筆整理而成（非店頭開價）。</div>`:''}
    ${(p.vs&&p.vs.trim())?`<div class="vs-box"><span class="al">對戰華雄音樂匯${p.vsPublic?'':'（內部）'}</span>${esc(p.vs)}</div>`:''}
    <div class="msec-title">建 案 資 訊</div>
    <div class="info-grid">
      <div class="info-cell"><div class="ic-label">地址</div><div class="ic-val">${esc(p.addr)}</div></div>
      <div class="info-cell"><div class="ic-label">樓層 / 戶數</div><div class="ic-val">${esc(p.floor)} / ${p.units} 戶</div></div>
      <div class="info-cell"><div class="ic-label">建造執照</div><div class="ic-val" style="font-size:13px">${esc(p.permit||'—')}</div></div>
      <div class="info-cell"><div class="ic-label">貸款 / 交屋</div><div class="ic-val">${esc(p.loan||'—')} / ${esc(p.handover||'—')}</div></div>
      <div class="info-cell full"><div class="ic-label">格局規劃</div><div class="ic-val">${esc(p.layout)}</div></div>
      ${(p.r1||p.r2||p.r3||p.r4)?`<div class="info-cell full"><div class="ic-label">房型比例</div><div class="ic-val" style="display:flex;align-items:center;gap:12px">${donut}
        <div style="font-size:13px;color:var(--dim);line-height:1.8">${p.r2?`2房 ${p.r2}%　`:''}${p.r3?`3房 ${p.r3}%　`:''}${p.r4?`4房 ${p.r4}%`:''}</div></div></div>`:''}
    </div>
    <div class="msec-title">廚 衛 建 材</div>
    <div class="mat-list">
      ${(p.kit||[]).map(k=>`<span class="chip k">廚 ${esc(k)}</span>`).join('')}
      ${(p.bath||[]).map(b=>`<span class="chip b">衛 ${esc(b)}</span>`).join('')}</div>
    <div class="msec-title">特 色 配 備</div>
    <div class="mat-list">${(p.other||[]).map(o=>`<span class="chip">${esc(o)}</span>`).join('')}</div>
    ${p.amenities&&Object.keys(p.amenities).length?`<div class="msec-title">公 設 設 施</div>
      <div>${Object.entries(p.amenities).map(([cat,items])=>`<div class="am-group"><div class="am-group-label">${esc(cat)}</div>
      <div class="am-chips">${items.map(it=>`<span class="chip am">${esc(it)}</span>`).join('')}</div></div>`).join('')}</div>`:''}
    ${p.notes?`<div class="notes-box"><b style="color:var(--amber)">注意事項</b><br>${esc(p.notes)}</div>`:''}
    ${p.warnReason?`<div class="notes-box"><b style="color:var(--amber)">⚠ 警示</b><br>${esc(p.warnReason)}</div>`:''}
    <div class="analysis-box"><span class="al">分 析 觀 點</span>${esc(p.analysis)}</div>
    ${fpHtml}
    <div class="link-row">
      ${(p.leju||p.sleju)?`<a class="link-btn" href="${esc(p.leju||p.sleju)}" target="_blank">樂居 ↗</a>`:''}
      ${p.lat!=null?`<a class="link-btn" href="https://www.google.com/maps/?q=${p.lat},${p.lng}" target="_blank">Google Map ↗</a>`:''}</div>`;
  document.getElementById('overlay').classList.add('open');
  if(mapObj&&p.lat!=null) mapObj.setView([p.lat,p.lng],17,{animate:true});
}
function closeModal(){document.getElementById('overlay').classList.remove('open')}

/* ── 燈箱 ── */
let lbProj=null,lbIdx=0;
function openLB(pi,idx){
  lbProj=projects[pi];lbIdx=idx;
  document.getElementById('lbImg').src=lbProj.floorPlans[idx];
  document.getElementById('lbCounter').textContent=(idx+1)+' / '+lbProj.floorPlans.length;
  document.getElementById('lbOverlay').classList.add('on');
}
function closeLB(){document.getElementById('lbOverlay').classList.remove('on')}
function lbNav(d){
  const imgs=lbProj.floorPlans;
  lbIdx=(lbIdx+d+imgs.length)%imgs.length;
  document.getElementById('lbImg').src=imgs[lbIdx];
  document.getElementById('lbCounter').textContent=(lbIdx+1)+' / '+imgs.length;
}
document.addEventListener('keydown',e=>{
  const lb=document.getElementById('lbOverlay');
  if(lb.classList.contains('on')){
    if(e.key==='Escape')closeLB();
    if(e.key==='ArrowLeft')lbNav(-1);
    if(e.key==='ArrowRight')lbNav(1);
  }else if(e.key==='Escape')closeModal();
});

/* ── 啟動：讀同一份 data.json，只保留大寮區 ── */
async function boot(){
  try{
    if(window.__DATA__){ DB=window.__DATA__; }
    else{
      const r=await fetch('./data.json?t='+Date.now());
      if(!r.ok) throw new Error('HTTP '+r.status);
      DB=await r.json();
    }
  }catch(err){
    const el=document.getElementById('loadErr');
    el.style.display='block';
    el.innerHTML=`<b style="color:var(--red)">資料載入失敗</b><br>無法讀取 data.json（${esc(err.message)}）。<br>
    1. 確認 data.json 與 daliao.html 在 GitHub 同一層目錄。<br>
    2. 若是離線開啟（USB 直接點開檔案），瀏覽器會封鎖本機讀檔。`;
    return;
  }
  S=DB.settings;
  projects=DB.projects.filter(p=>p.district===PAGE_DISTRICT);
  renderHeader(); renderCards();
  ['searchInput','statusFilter','sortSelect'].forEach(id=>{
    document.getElementById(id).addEventListener(id==='searchInput'?'input':'change',renderCards);
  });
  setView('list');
}
boot();
</script>
